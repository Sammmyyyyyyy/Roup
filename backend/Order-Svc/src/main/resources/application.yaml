server:
  port: 0

spring:
  application:
    name: orders-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.uuid}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000