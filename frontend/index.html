<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b09" />
    <script>
      try {
        const savedTheme = localStorage.getItem('roup-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]').content = savedTheme === 'light' ? '#f7f9f7' : '#070b09';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="description" content="Discover and trade limited-edition festival passes and collectibles on Roup, a marketplace designed around transparent trading rules." />
    <title>Roup — Rare Passes. Real Markets. Fairer Trades.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>document.documentElement.classList.add('js');</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
